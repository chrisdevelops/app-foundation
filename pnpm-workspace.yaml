packages:
  - 'apps/*'
  - 'packages/*'

# Isolated layout (the pnpm default) on purpose: no `nodeLinker: hoisted` and
# no `shamefullyHoist`, so a package can import only what it or the root
# declares (ADR 0004 decision 3 A; ADR 0007 item 6).

# Only these patterns are linked into the root node_modules. Keep the list
# narrow; each entry carries its reason on the same line. Widening it needs an ADR.
publicHoistPattern:
  - '@types/*' # Electron Forge's install check needs a public hoist pattern in the isolated layout (spike #6); type declarations only, no runtime code (ADR 0007 item 5)

# pnpm 11 runs no dependency build script unless the package is named here
# (spike #9, "The method" item 1). Empty until a package needs one; #15 adds
# `electron` (ADR 0007 item 7). One entry per package, never a wildcard.
allowBuilds: {}
