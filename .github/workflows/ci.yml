name: Probe 46 rm
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        variant: [old-rm, new-rm]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - if: matrix.variant == 'old-rm'
        run: Copy-Item tools/probe/old-cleanup.ts tools/test-support/app-process-cleanup.ts -Force
      - run: pnpm turbo run test --filter=// -- tools/test-support/app-process-cleanup.gate.test.ts
