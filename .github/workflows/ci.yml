# THROWAWAY PROBE for #46 attempt 3 (test author). Never merged; branch deleted after the run.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.os }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        variant: [current, show-inactive, show]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Apply the implementation variant
        if: matrix.variant != 'current'
        run: cp "probe-variants/${{ matrix.variant }}/app-window.ts" packages/foundation/src/main/app-window.ts && git diff --stat
      - name: Reference app TST-018 gates
        run: pnpm exec vitest run tools/reference-app/reference-app-build.gate.test.ts -t TST-018 --reporter=verbose || echo "PROBE-EXIT=$?"
      - name: Harness background gate (fixture; independent of the variant)
        if: matrix.variant == 'current'
        working-directory: e2e
        run: pnpm exec vitest run --project harness-gates harness/smoke-app-harness-background.gate.test.ts --reporter=verbose || echo "PROBE-EXIT=$?"
