name: Probe 46 process list
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  cold:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: $PSVersionTable | Out-String; pwsh -NoProfile -Command '$PSVersionTable | Out-String'; Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber; (Get-Process).Count
      - run: node tools/probe/process-list-probe.ts cold
      - run: node tools/probe/process-list-probe.ts cold-2
  suite:
    runs-on: windows-latest
    env:
      PROBE_LOG: ${{ runner.temp }}\probe-calls.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: node tools/probe/process-list-probe.ts before-install
      - run: pnpm install --frozen-lockfile
      - run: node tools/probe/process-list-probe.ts after-install
      - run: pnpm turbo run test
        continue-on-error: true
      - run: Get-Content $env:PROBE_LOG
        if: always()
      - run: node tools/probe/process-list-probe.ts after-suite
        if: always()
