name: Probe 46 EPERM
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        variant: [ref-plain, ref-debug, suite-plain, suite-debug]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - if: endsWith(matrix.variant, 'debug')
        run: New-Item -ItemType File D:\a\_temp\debug-privilege
      - if: startsWith(matrix.variant, 'ref')
        run: pnpm exec vitest run tools/reference-app/reference-app-build.gate.test.ts
        continue-on-error: true
      - if: startsWith(matrix.variant, 'suite')
        run: pnpm turbo run test
        continue-on-error: true
      - run: Get-Content D:\a\_temp\eperm-diag.log
        if: always()
